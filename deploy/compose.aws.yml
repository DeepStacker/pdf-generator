# Audit Engine web stack for a plain Docker host (EC2, or anything else).
#
# The difference from compose.prod.yml is how traffic arrives. That file is
# for the home server, where a Tailscale sidecar joins the tailnet and nothing
# is published to the host at all. Here the app publishes a port and something
# in front of it terminates TLS: an AWS load balancer, or the optional nginx
# service below.
#
#   docker compose -f deploy/compose.aws.yml --env-file deploy/.env.production up -d --build
#
# See deploy/AWS.md. One instance only -- the SQLite database and the accounts
# live on this host's volume, so two replicas would not share users.

name: pdfgen

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: pdfgen-app
    restart: unless-stopped
    # Published so a load balancer or the browser can reach it. Bind to
    # 127.0.0.1 (BIND_ADDRESS) when something on this host proxies to it, and
    # let the security group be the only thing that decides who may connect.
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${HOST_PORT:-8080}:8080"
    environment:
      PORT: 8080
      # Everything the app persists lives on the volume below. Left to itself
      # it would write into the container's home directory, which a rebuild
      # throws away.
      REPORT_STORAGE_DIR: /data/reports
      AUDIT_ENGINE_DB_PATH: /data/audit_engine.db
      AUDIT_ENGINE_LOG_PATH: /data/audit_engine.log
      # Authentication. The app refuses every request without the hash, which
      # is what keeps an unconfigured deploy from serving customer data openly.
      GSS_AUTH_PASSWORD_HASH: ${GSS_AUTH_PASSWORD_HASH:-}
      GSS_SECRET_KEY: ${GSS_SECRET_KEY:-}
      GSS_AUTH_USER: ${GSS_AUTH_USER:-admin}
      # Leave this alone unless you are smoke-testing over plain HTTP before
      # TLS is in front. A Secure cookie is dropped by the browser on http://,
      # which looks exactly like a wrong password.
      GSS_COOKIE_SECURE: ${GSS_COOKIE_SECURE:-true}
    volumes:
      - pdfgen_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    networks: [pdfgen_net]

  # The reverse proxy. Optional, and off unless you ask for it:
  #
  #   docker compose -f deploy/compose.aws.yml --env-file deploy/.env.production \
  #       --profile proxy up -d
  #
  # Two reasons to run it rather than exposing the app directly. It absorbs
  # slow uploads, which matters because the app serves one request at a time
  # and a folder of branch PDFs takes a while to arrive; and it is where TLS
  # lives when there is no load balancer doing it.
  #
  # NGINX_CONF picks the config: app.conf proxies plain HTTP on :80 (right
  # behind an AWS load balancer, which terminates TLS itself), app-tls.conf
  # redirects :80 to :443 and serves TLS from the certificate in TLS_CERT_DIR.
  # Drop your own file in deploy/nginx/ and name it here to replace both.
  nginx:
    image: docker.io/library/nginx:1.27-alpine
    profiles: [proxy]
    restart: unless-stopped
    ports:
      # 80 and 443 in production. Overridable so this can be brought up beside
      # something that already owns them, which is also how it gets tested.
      - "${PROXY_HTTP_PORT:-80}:80"
      - "${PROXY_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/${NGINX_CONF:-app.conf}:/etc/nginx/conf.d/default.conf:ro
      # fullchain.pem and privkey.pem, read only by app-tls.conf. The default
      # points at a directory that need not exist for the plain HTTP config;
      # compose creates it empty rather than failing.
      - ${TLS_CERT_DIR:-./certs}:/etc/nginx/certs:ro
    depends_on:
      app:
        condition: service_healthy
    networks: [pdfgen_net]

volumes:
  pdfgen_data:

networks:
  pdfgen_net:
    driver: bridge
