# Plain HTTP in front of the app. Use this behind an AWS load balancer, which
# terminates TLS and talks to this port.
#
# server_name _ deliberately: the balancer already decided which host this is,
# and hard-coding a domain here only creates a second place to change one.

upstream audit_app {
    server app:8080;
}

server {
    listen 80 default_server;
    server_name _;

    # A folder of branch PDFs is the whole point of this application, and the
    # 1MB default would reject every one of them.
    client_max_body_size 2G;

    # Merging a few hundred PDFs takes longer than the 60s default, and the
    # response only starts once it is done.
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;

    location / {
        proxy_pass http://audit_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        # Login throttling counts failures per client address, so the real one
        # has to survive this hop.
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Request buffering stays on. The app serves one request at a time, so
        # letting nginx absorb a slow upload keeps a phone on hotel wifi from
        # holding the whole server while it sends.
        proxy_request_buffering on;
        # The zip comes back in one piece and can be large; stream it out
        # rather than spooling it to this container's disk first.
        proxy_buffering off;
    }
}
