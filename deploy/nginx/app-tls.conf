# TLS in front of the app, for a host with its own certificate and no load
# balancer doing it. TLS_CERT_DIR is mounted at /etc/nginx/certs and must hold
# fullchain.pem and privkey.pem.
#
# With certbot on the host, those two files live under
# /etc/letsencrypt/live/<domain>/ as symlinks into ../../archive, which do not
# survive being mounted on their own -- copy them into the directory you mount
# and re-copy on renewal. deploy/AWS.md has the renewal hook.

upstream audit_app {
    server app:8080;
}

server {
    listen 80 default_server;
    server_name _;

    # The one thing that stays on plain HTTP, so certbot's webroot challenge
    # can be answered without stopping nginx.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # A folder of branch PDFs is the whole point of this application, and the
    # 1MB default would reject every one of them.
    client_max_body_size 2G;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;

    location / {
        proxy_pass http://audit_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_request_buffering on;
        proxy_buffering off;
    }
}
