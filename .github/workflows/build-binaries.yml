name: Build & Release
on:
  push:
    branches: [main]
    paths: ["src/audit_engine/_version.py"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      windows:
        description: "Build the Windows binary"
        type: boolean
        default: true
      macos:
        description: "Build the macOS binary"
        type: boolean
        default: false
      linux:
        description: "Build the Linux binary"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  setup:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract.outputs.version }}
      tag: ${{ steps.extract.outputs.tag }}
      windows: ${{ steps.targets.outputs.windows }}
      macos: ${{ steps.targets.outputs.macos }}
      linux: ${{ steps.targets.outputs.linux }}
    steps:
      - name: Decide which platforms to build
        id: targets
        env:
          # Which platforms an automatic (version-bump) build publishes.
          # Flip a value to "true" to start shipping that platform again; a
          # manual run from the Actions tab can override any of them per-run
          # without editing this file.
          DEFAULT_WINDOWS: "true"
          DEFAULT_MACOS: "false"
          DEFAULT_LINUX: "false"
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            WIN="${{ inputs.windows }}"; MAC="${{ inputs.macos }}"; LIN="${{ inputs.linux }}"
          else
            WIN="$DEFAULT_WINDOWS"; MAC="$DEFAULT_MACOS"; LIN="$DEFAULT_LINUX"
          fi
          {
            echo "windows=$WIN"
            echo "macos=$MAC"
            echo "linux=$LIN"
          } >> "$GITHUB_OUTPUT"
          echo "building -> windows=$WIN macos=$MAC linux=$LIN"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract version
        id: extract
        run: |
          VERSION=$(grep -oE '__version__ = "[0-9.]+"' src/audit_engine/_version.py | cut -d '"' -f 2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
      - name: Create tag if missing
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG="${{ steps.extract.outputs.tag }}"
          if ! git tag -l "$TAG" | grep -q .; then
            git tag "$TAG"
            git push origin "$TAG" 2>/dev/null || true
          fi
      - name: Create release if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WANT_WINDOWS: ${{ steps.targets.outputs.windows }}
          WANT_MACOS: ${{ steps.targets.outputs.macos }}
          WANT_LINUX: ${{ steps.targets.outputs.linux }}
        run: |
          set -eu
          # Only document the platforms this run actually publishes, so the
          # notes never point at a download that is not there.
          NOTES=/tmp/notes.md
          : > "$NOTES"
          say() { printf '%s\n' "$1" >> "$NOTES"; }

          say "## Install"
          if [ "$WANT_WINDOWS" = "true" ]; then
            say ""
            say "### Windows"
            say "Unzip and run \`Audit_Engine_Elite.exe\`. If SmartScreen appears,"
            say "choose **More info -> Run anyway**."
          fi
          if [ "$WANT_MACOS" = "true" ]; then
            say ""
            say "### macOS (Apple Silicon)"
            say "macOS blocks this app on first launch because it is not signed"
            say "with a paid Apple Developer ID. Unzip it, then run this once in"
            say "Terminal:"
            say ""
            say "    xattr -dr com.apple.quarantine /path/to/Audit_Engine_Elite.app"
            say ""
            say "Then open the app normally. (Double-clicking before this step"
            say "shows \"damaged and can't be opened\" - the download is fine, it"
            say "is Gatekeeper.)"
          fi
          if [ "$WANT_LINUX" = "true" ]; then
            say ""
            say "### Linux"
            say "Extract the tarball and run the \`Audit_Engine_Elite\` binary"
            say "(\`chmod +x\` it first if needed)."
          fi
          say ""
          say "---"
          say "Verify a download with the matching \`.sha256\` file."

          gh release create "${{ steps.extract.outputs.tag }}" \
            --title "${{ steps.extract.outputs.tag }}" \
            --notes-file "$NOTES" 2>/dev/null || true

  windows:
    if: needs.setup.outputs.windows == 'true'
    timeout-minutes: 45
    needs: setup
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: pip-win-${{ hashFiles('pyproject.toml') }}
          restore-keys: pip-win-
      - uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pyinstaller
          key: pyi-win-${{ hashFiles('pdf_generator.spec') }}
          restore-keys: pyi-win-
      - run: pip install pyinstaller pywebview comtypes reportlab openpyxl "numpy<2" "pandas<2.2" certifi "sv-ttk"
      # Install the project last so every runtime dep in pyproject.toml
      # (e.g. pypdf) is present for PyInstaller to bundle. The pins above
      # are already satisfied, so this does not upgrade them.
      - run: pip install -e .
      - name: Verify runtime deps are importable
        run: python -c "import bottle, openpyxl, reportlab, pandas, PIL, certifi, pypdf; print('runtime deps OK')"
      - name: Verify Tcl/Tk environment
        run: |
          python -c "import sys; print('Python:', sys.executable)"
          python -c "import _tkinter; print('_tkinter OK:', _tkinter.__file__)"
      - run: pyinstaller --noconfirm --clean pdf_generator.spec
      - name: Verify built exe
        shell: pwsh
        run: |
          $exe = "dist\Audit_Engine_Elite.exe"
          if (Test-Path $exe) {
            $size = (Get-Item $exe).Length / 1MB
            Write-Host "Built exe size: $([math]::Round($size, 2)) MB"
            Write-Host "Built exe path: $exe"
          } else {
            Write-Error "Build failed: exe not found!"
            exit 1
          }
      - name: Package and checksum
        shell: pwsh
        run: |
          $TAG = "${{ needs.setup.outputs.tag }}"
          Compress-Archive -Path dist\* -DestinationPath "Audit_Engine_${TAG}_binary_windows.zip"
          $hash = (Get-FileHash "Audit_Engine_${TAG}_binary_windows.zip" -Algorithm SHA256).Hash.ToLower()
          [System.IO.File]::WriteAllText("Audit_Engine_${TAG}_binary_windows.zip.sha256", $hash)
      - name: Upload to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $TAG = "${{ needs.setup.outputs.tag }}"
          gh release create $TAG --title $TAG --notes "" 2>$null; $true
          $zip = "Audit_Engine_${TAG}_binary_windows.zip"
          $sha = "$zip.sha256"
          gh release upload $TAG $zip $sha --clobber

  macos:
    if: needs.setup.outputs.macos == 'true'
    timeout-minutes: 45
    needs: setup
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/Library/Caches/pip
          key: pip-macos-${{ hashFiles('pyproject.toml') }}
          restore-keys: pip-macos-
      - uses: actions/cache@v4
        with:
          path: ~/Library/Caches/pyinstaller
          key: pyi-macos-${{ hashFiles('pdf_generator.spec') }}
          restore-keys: pyi-macos-
      - run: pip install pyinstaller pywebview reportlab openpyxl "numpy<2" "pandas<2.2" certifi "sv-ttk"
      - run: pip install -e .
      - name: Verify runtime deps are importable
        run: python -c "import bottle, openpyxl, reportlab, pandas, PIL, certifi, pypdf; print('runtime deps OK')"
      - run: pyinstaller --noconfirm pdf_generator.spec
      - name: Ad-hoc code sign
        run: |
          codesign --force --deep --sign - dist/Audit_Engine_Elite.app 2>/dev/null \
            || codesign --force --deep --sign - dist/Audit_Engine_Elite || true
      - name: Package and checksum
        run: |
          TAG="${{ needs.setup.outputs.tag }}"
          cd dist
          if [ -d "Audit_Engine_Elite.app" ]; then
            zip -ry "../Audit_Engine_${TAG}_binary_macos.zip" "Audit_Engine_Elite.app"
          else
            zip -ry "../Audit_Engine_${TAG}_binary_macos.zip" .
          fi
          cd ..
          shasum -a 256 "Audit_Engine_${TAG}_binary_macos.zip" \
            | awk '{print $1}' > "Audit_Engine_${TAG}_binary_macos.zip.sha256"
      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.setup.outputs.tag }}"
          gh release create "$TAG" --title "$TAG" --notes "" 2>/dev/null || true
          ZIP="Audit_Engine_${TAG}_binary_macos.zip"
          SHA="${ZIP}.sha256"
          gh release upload "$TAG" "$ZIP" "$SHA" --clobber

  linux:
    if: needs.setup.outputs.linux == 'true'
    timeout-minutes: 45
    needs: setup
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-linux-${{ hashFiles('pyproject.toml') }}
          restore-keys: pip-linux-
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pyinstaller
          key: pyi-linux-${{ hashFiles('pdf_generator.spec') }}
          restore-keys: pyi-linux-
      - name: Install system dependencies (Linux GTK/WebKit2)
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -eux
          # sudo resets the environment, so DEBIAN_FRONTEND has to be passed
          # explicitly — without it a package that asks a debconf question
          # blocks on stdin forever instead of taking the default.
          APT="sudo env DEBIAN_FRONTEND=noninteractive apt-get -y -o Dpkg::Use-Pty=0"
          # A fresh runner may still be running unattended-upgrades. Both
          # loops use if/then so that a failing probe cannot trip `set -e`.
          for _ in $(seq 1 30); do
            if ! sudo fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1; then break; fi
            echo "waiting for the dpkg lock..."; sleep 5
          done
          for attempt in 1 2 3; do
            if $APT update; then break; fi
            echo "apt-get update failed (attempt $attempt); retrying"; sleep 10
          done
          $APT install --no-install-recommends patchelf libgirepository-2.0-dev libcairo2-dev pkg-config gobject-introspection libgtk-3-dev libgdk-pixbuf-2.0-dev libgtk-3-bin libglib2.0-bin libwebkit2gtk-4.1-dev gir1.2-gtk-3.0 gir1.2-webkit2-4.1 gir1.2-girepository-3.0 gir1.2-soup-3.0 gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav
      - run: PKG_CONFIG_PATH="/usr/lib/x86_64-linux-gnu/pkgconfig:${PKG_CONFIG_PATH}" pip install pyinstaller pywebview pygobject reportlab openpyxl "numpy<2" "pandas<2.2" certifi "sv-ttk" staticx
      - run: pip install -e .
      - name: Verify runtime deps are importable
        run: python -c "import bottle, openpyxl, reportlab, pandas, PIL, certifi, pypdf; print('runtime deps OK')"
      - name: Query GI modules to seed PyInstaller cache
        run: |
          python3 -c "
          import gi
          gi.require_version('GIRepository', '3.0'); from gi.repository import GIRepository
          gi.require_version('Gtk', '3.0'); from gi.repository import Gtk, Gdk, GLib, Gio
          gi.require_version('WebKit2', '4.1'); from gi.repository import WebKit2
          gi.require_version('Soup', '3.0'); from gi.repository import Soup
          print('GI modules OK')
          "
      - name: Generate GTK runtime caches
        run: |
          # Find gdk-pixbuf-query-loaders (sometimes not in PATH on Ubuntu 24.04)
          GDK_QUERY=$(pkg-config --variable=gdk_pixbuf_query_loaders gdk-pixbuf-2.0 2>/dev/null)
          if [ -z "$GDK_QUERY" ] || [ ! -x "$GDK_QUERY" ]; then
            GDK_QUERY=$(find /usr/lib /usr/bin -name 'gdk-pixbuf-query-loaders' -type f 2>/dev/null | head -1)
          fi
          if [ -z "$GDK_QUERY" ] || [ ! -x "$GDK_QUERY" ]; then
            echo "ERROR: gdk-pixbuf-query-loaders not found" >&2
            exit 1
          fi
          echo "Using gdk-pixbuf-query-loaders: $GDK_QUERY"

          # Find loader .so files
          LOADERS_DIR=$(pkg-config --variable=gdk_pixbuf_moduledir gdk-pixbuf-2.0 2>/dev/null)
          if [ -z "$LOADERS_DIR" ]; then
            LOADERS_DIR=$(find /usr/lib -path '*/gdk-pixbuf-2.0/*/loaders' -type d 2>/dev/null | head -1)
          fi
          if [ -n "$LOADERS_DIR" ] && [ -d "$LOADERS_DIR" ]; then
            "$GDK_QUERY" "$LOADERS_DIR"/*.so > gdk-pixbuf-loaders.cache
          else
            "$GDK_QUERY" > gdk-pixbuf-loaders.cache
          fi
          # Replace absolute paths with @MEIPASS@ placeholder
          MODULE_DIR=$(dirname "$LOADERS_DIR" 2>/dev/null || echo "/usr/lib/x86_64-linux-gnu/gdk-pixbuf-2.0/2.10.0/loaders")
          sed -i "s|$MODULE_DIR/|@MEIPASS@/gdk-pixbuf-loaders/|g" gdk-pixbuf-loaders.cache

          # Find gtk-query-immodules-3.0
          GTK_QUERY=$(pkg-config --variable=gtk_query_immodules gtk+-3.0 2>/dev/null || true)
          if [ -z "$GTK_QUERY" ] || [ ! -x "$GTK_QUERY" ]; then
            GTK_QUERY=$(find /usr/lib /usr/bin -name 'gtk-query-immodules-3.0' -type f 2>/dev/null | head -1)
          fi
          if [ -z "$GTK_QUERY" ] || [ ! -x "$GTK_QUERY" ]; then
            echo "WARNING: gtk-query-immodules-3.0 not found, skipping GTK immodules cache" >&2
          else
            echo "Using gtk-query-immodules-3.0: $GTK_QUERY"
            "$GTK_QUERY" > gtk-immodules.cache
            GTK_IMMODULE_DIR=$(sed -n 's|"\(.*\)/im-.*\.so"|\1|p' gtk-immodules.cache | head -1)
            if [ -z "$GTK_IMMODULE_DIR" ]; then
              GTK_IMMODULE_DIR=$(find /usr/lib -path '*/gtk-3.0/*/immodules' -type d 2>/dev/null | head -1)
            fi
            if [ -n "$GTK_IMMODULE_DIR" ]; then
              sed -i "s|$GTK_IMMODULE_DIR/|@MEIPASS@/gtk-immodules/|g" gtk-immodules.cache
            fi
          fi

          # Compile GLib schemas (directory must be writable, use temp copy if needed)
          if [ -d "/usr/share/glib-2.0/schemas" ]; then
            sudo glib-compile-schemas /usr/share/glib-2.0/schemas/ || true
          fi
      - name: Patch WebKit library for relocatable helper binaries
        run: |
          echo "Patching libwebkit2gtk-4.1.so: /usr -> /tmp (for StaticX relocatability)..."
          sudo python3 -c "
          import os
          for lib_path in ['/usr/lib/x86_64-linux-gnu/libwebkit2gtk-4.1.so.0']:
              if os.path.exists(lib_path):
                  with open(lib_path, 'rb') as f:
                      data = f.read()
                  count = data.count(b'/usr')
                  data = data.replace(b'/usr', b'/tmp')
                  with open(lib_path, 'wb') as f:
                      f.write(data)
                  print(f'  Patched {lib_path}: {count} replacements')
              else:
                  print(f'  SKIP {lib_path}: not found')
          "
      - name: Strip DT_RUNPATH from libraries (required for StaticX compatibility)
        run: |
          set -eu
          # Only strip libproxy and Python toolcache files (not numpy, which
          # needs its OpenBLAS RPATH).
          find /opt/hostedtoolcache/Python -path '*/lib-dynload/*.so*' -type f \
            -exec patchelf --remove-rpath {} + 2>/dev/null || true
          sudo find /usr/lib -name 'libproxy*' -type f -exec patchelf --remove-rpath {} + 2>/dev/null || true
          sudo find /usr/lib -name 'libpxbackend*' -type f -exec patchelf --remove-rpath {} + 2>/dev/null || true

          # The Python patch version moves whenever setup-python updates, so
          # find libpython instead of naming it. Hard-coding it meant the path
          # silently stopped existing and `|| true` hid that, leaving
          # DT_RUNPATH in place until StaticX rejected the build much later.
          found=0
          while IFS= read -r lib; do
            found=1
            patchelf --remove-rpath "$lib"
            if patchelf --print-rpath "$lib" | grep -q .; then
              echo "DT_RUNPATH still set on $lib" >&2
              exit 1
            fi
          done < <(find /opt/hostedtoolcache/Python -name 'libpython3*.so*' -type f)
          if [ "$found" -eq 0 ]; then
            echo "no libpython found under the tool cache - StaticX would fail later" >&2
            exit 1
          fi
          echo "Done stripping RUNPATH"
      - name: Patch numpy to disable source-tree detection at build time
        run: |
          python3 hooks/patch_numpy.py
          python3 -c "import numpy; print('numpy import OK after patch')"
      - run: pyinstaller --noconfirm pdf_generator.spec
      - name: Bundle all shared libraries with StaticX
        run: |
          staticx dist/Audit_Engine_Elite dist/Audit_Engine_Elite
          ls -lh dist/Audit_Engine_Elite
      - name: Package and checksum
        run: |
          TAG="${{ needs.setup.outputs.tag }}"
          cd dist
          tar czf "../Audit_Engine_${TAG}_binary_linux.tar.gz" .
          cd ..
          shasum -a 256 "Audit_Engine_${TAG}_binary_linux.tar.gz" \
            | awk '{print $1}' > "Audit_Engine_${TAG}_binary_linux.tar.gz.sha256"
      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.setup.outputs.tag }}"
          gh release create "$TAG" --title "$TAG" --notes "" 2>/dev/null || true
          TAR="Audit_Engine_${TAG}_binary_linux.tar.gz"
          SHA="${TAR}.sha256"
          gh release upload "$TAG" "$TAR" "$SHA" --clobber
