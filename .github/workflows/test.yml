name: Test

on:
  push:
    branches: [main, refactor/architecture]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: pip-test-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            pip-test-${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: python -m ruff check src/ tests/

      - name: Test with pytest
        run: python -m pytest tests/ -v --tb=short

  # The browser front end is built from source into the image, so a change to
  # web/src that does not compile has to fail here rather than at deploy time.
  # Nothing checked it before: CI ran only the Python suite, and the bundle
  # was a committed artifact that could sit stale indefinitely.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        working-directory: web
        run: npm run lint

      - name: Build
        working-directory: web
        run: npm run build

      - name: Check the build produced what the server serves
        run: |
          set -e
          for f in index.html sw.js manifest.webmanifest favicon.svg; do
            test -f "audit_engine_web/static/$f" || { echo "build did not produce $f"; exit 1; }
          done
          ls audit_engine_web/static/assets/*.js >/dev/null
          ls audit_engine_web/static/assets/*.css >/dev/null
          echo "front end built and complete"
